<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>安全分享 · 管理后台</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<aside class="side">
  <div class="brand">安全<span>分享</span></div>
  <nav class="nav" id="sideNav">
    <a href="/"><span class="ic">＋</span><span class="txt">创建分享</span></a>
    <a class="nav-auth" href="/admin.html" data-key="mine"><span class="ic">📁</span><span class="txt">我的分享</span></a>
    <a class="nav-auth" href="/admin.html#files" data-key="files"><span class="ic">🗂</span><span class="txt">文件管理</span></a>
    <a class="nav-super" href="/admin.html#super" data-key="super"><span class="ic">🛡</span><span class="txt">管理后台</span></a>
    <a class="nav-auth" href="/settings.html"><span class="ic">⚙</span><span class="txt">设置</span></a>
  </nav>
  <div class="me">
    <div class="av">安</div>
    <div><div class="me-n">安全分享</div><small>内部工作台</small></div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="crumb"><b>管理后台</b></div>
    <div class="top-right">
      <a class="btn sm" href="/">＋ 新建分享</a>
      <span id="userArea" class="sub"></span>
    </div>
  </div>
  <div class="wrap">
  <div class="tabs" id="tabs" style="display:none">
    <button class="tab active" data-tab="mine">我的分享</button>
    <button class="tab" data-tab="files" id="tabFiles">文件管理</button>
    <button class="tab" data-tab="org">全店分享</button>
    <button class="tab" data-tab="members">成员</button>
    <button class="tab" data-tab="invite">邀请码</button>
    <button class="tab" data-tab="allshares" id="tabAllShares" style="display:none">全部分享</button>
    <button class="tab" data-tab="stats" id="tabStats" style="display:none">存储用量</button>
    <button class="tab" data-tab="dashboard" id="tabDashboard" style="display:none">数据概览</button>
    <button class="tab" data-tab="users" id="tabUsers" style="display:none">用户管理</button>
    <button class="tab" data-tab="audit" id="tabAudit" style="display:none">操作日志</button>
  </div>

  <div id="list"></div>

  <div id="orgPanel" style="display:none">
    <div id="orgShares"></div>
    <div id="orgMembers" style="display:none"></div>
    <div id="orgInvite" style="display:none">
      <button class="btn sm" id="genInvite">生成新邀请码</button>
      <span id="inviteCode" class="tag on" style="margin-left:10px;display:none"></span>
      <p class="sub" style="margin-top:8px">把邀请码发给同事，注册时填写即可加入本组织。</p>
    </div>
  </div>

  <div id="superPanel" style="display:none">
    <div id="superAllShares" style="display:none"></div>
    <div id="superStats" style="display:none"></div>
    <div id="superUsers" style="display:none"></div>
    <div id="superAudit" style="display:none"></div>
  </div>

  <div id="filesPanel" style="display:none"></div>
  <div id="dashboardPanel" style="display:none"></div>

  <div class="empty" id="empty" style="display:none">还没有分享记录。<a href="/">去创建一个 →</a></div>
  </div>
</div>

<div class="modal" id="logsModal">
  <div class="box" style="max-width:640px;text-align:left">
    <h2>查看者明细</h2>
    <div id="logsBody" style="max-height:60vh;overflow:auto"></div>
    <button class="btn ghost sm" style="margin-top:12px" onclick="document.getElementById('logsModal').classList.remove('show')">关闭</button>
  </div>
</div>

<div class="modal" id="editModal">
  <div class="box" style="max-width:480px;text-align:left">
    <h2>修改权限</h2>
    <div id="editBody"></div>
    <div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end">
      <button class="btn ghost sm" onclick="document.getElementById('editModal').classList.remove('show')">取消</button>
      <button class="btn sm" id="saveEdit">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="apprModal">
  <div class="box" style="max-width:480px;text-align:left">
    <h2>访问授权申请</h2>
    <div id="apprBody"></div>
    <button class="btn ghost sm" style="margin-top:12px" onclick="document.getElementById('apprModal').classList.remove('show')">关闭</button>
  </div>
</div>

<div class="modal" id="loginModal">
  <div class="box login-box">
    <button class="modal-close" id="loginClose" aria-label="关闭">×</button>
    <div class="login-head">
      <div class="login-logo">🔐</div>
      <h2 id="loginTitle">欢迎回来</h2>
      <p class="sub" id="loginSub">登录以管理你的安全分享</p>
    </div>
    <div class="seg">
      <button type="button" class="seg-btn active" id="loginTabLogin" data-mode="login">登录</button>
      <button type="button" class="seg-btn" id="loginTabReg" data-mode="register">注册</button>
    </div>
    <div id="loginMsg" class="form-msg"></div>
    <div class="field login-field">
      <label>邮箱</label>
      <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="username" />
    </div>
    <div class="field login-field">
      <label>密码</label>
      <div class="pw-wrap">
        <input id="loginPw" type="password" placeholder="至少 8 位" autocomplete="current-password" />
        <button type="button" class="pw-toggle" id="loginPwToggle" aria-label="显示或隐藏密码" title="显示/隐藏密码">👁️</button>
      </div>
    </div>
    <label class="remember-row">
      <input type="checkbox" id="loginRemember" />
      <span>记住密码（本机保存，7 天内自动登录）</span>
    </label>
    <div class="field login-field" id="loginRealNameField" style="display:none">
      <label>真实姓名（必填）</label>
      <input id="loginRealName" placeholder="请输入真实姓名" autocomplete="name" />
    </div>
    <div class="field login-field" id="loginInviteField" style="display:none">
      <label>邀请码（选填，加入公司组织）</label>
      <input id="loginInvite" placeholder="如已有公司邀请码请填写" />
    </div>
    <!-- 蜜罐字段：真实用户不可见，自动化机器人若自动填充将被后端拒绝 -->
    <div class="hp" aria-hidden="true"><input type="text" id="loginCompany" tabindex="-1" autocomplete="off" /></div>
    <button class="btn" id="loginSubmit" style="width:100%;margin-top:4px">登录</button>
    <p class="sub login-foot" id="loginFoot">点击「注册」即表示同意内部使用规范</p>
    <div id="loginWxSection">
      <div class="divider"><span>或</span></div>
      <button class="btn ghost" id="loginWxBtn" style="width:100%">🟢 微信扫码登录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<!-- 替换文件用的隐藏文件选择器（分享卡片与文件管理共用） -->
<input type="file" id="replaceFileInput" style="display:none" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/env.js"></script>
<script src="/js/login-modal.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
