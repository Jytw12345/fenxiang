<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>安全分享 · 管理后台</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<aside class="side">
  <div class="brand">安全<span>分享</span></div>
  <nav class="nav">
    <a href="/"><span class="ic">＋</span><span class="txt">创建分享</span></a>
    <a href="/admin.html"><span class="ic">📁</span><span class="txt">我的分享</span></a>
    <a class="active" href="/admin.html"><span class="ic">🛡</span><span class="txt">管理后台</span></a>
    <a href="#"><span class="ic">⚙</span><span class="txt">设置</span></a>
  </nav>
  <div class="me">
    <div class="av">安</div>
    <div><div class="me-n">安全分享</div><small>内部工作台</small></div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="crumb"><b>管理后台</b></div>
    <div class="top-right">
      <a class="btn sm" href="/">＋ 新建分享</a>
      <span id="userArea" class="sub"></span>
    </div>
  </div>
  <div class="wrap">
  <div class="tabs" id="tabs" style="display:none">
    <button class="tab active" data-tab="mine">我的分享</button>
    <button class="tab" data-tab="org">全店分享</button>
    <button class="tab" data-tab="members">成员</button>
    <button class="tab" data-tab="invite">邀请码</button>
    <button class="tab" data-tab="stats" id="tabStats" style="display:none">存储用量</button>
    <button class="tab" data-tab="users" id="tabUsers" style="display:none">用户管理</button>
    <button class="tab" data-tab="audit" id="tabAudit" style="display:none">操作日志</button>
  </div>

  <div id="list"></div>

  <div id="orgPanel" style="display:none">
    <div id="orgShares"></div>
    <div id="orgMembers" style="display:none"></div>
    <div id="orgInvite" style="display:none">
      <button class="btn sm" id="genInvite">生成新邀请码</button>
      <span id="inviteCode" class="tag on" style="margin-left:10px;display:none"></span>
      <p class="sub" style="margin-top:8px">把邀请码发给同事，注册时填写即可加入本组织。</p>
    </div>
  </div>

  <div id="superPanel" style="display:none">
    <div id="superStats" style="display:none"></div>
    <div id="superUsers" style="display:none"></div>
    <div id="superAudit" style="display:none"></div>
  </div>

  <div class="empty" id="empty" style="display:none">还没有分享记录。<a href="/">去创建一个 →</a></div>
  </div>
</div>

<div class="modal" id="logsModal">
  <div class="box" style="max-width:640px;text-align:left">
    <h2>访问记录</h2>
    <div id="logsBody" style="max-height:60vh;overflow:auto"></div>
    <button class="btn ghost sm" style="margin-top:12px" onclick="document.getElementById('logsModal').classList.remove('show')">关闭</button>
  </div>
</div>

<div class="modal" id="editModal">
  <div class="box" style="max-width:480px;text-align:left">
    <h2>修改权限</h2>
    <div id="editBody"></div>
    <div style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end">
      <button class="btn ghost sm" onclick="document.getElementById('editModal').classList.remove('show')">取消</button>
      <button class="btn sm" id="saveEdit">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="apprModal">
  <div class="box" style="max-width:480px;text-align:left">
    <h2>访问授权申请</h2>
    <div id="apprBody"></div>
    <button class="btn ghost sm" style="margin-top:12px" onclick="document.getElementById('apprModal').classList.remove('show')">关闭</button>
  </div>
</div>

<div class="modal" id="loginModal">
  <div class="box" style="max-width:420px">
    <h2 id="loginTitle">登录</h2>
    <div id="loginMsg" class="sub" style="color:#e5484d;min-height:18px;margin-bottom:6px"></div>
    <div class="field">
      <label>邮箱</label>
      <input id="loginEmail" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label>密码</label>
      <input id="loginPw" type="password" placeholder="至少 8 位" />
    </div>
    <div class="field" id="loginInviteField" style="display:none">
      <label>邀请码（选填，加入公司组织）</label>
      <input id="loginInvite" placeholder="如已有公司邀请码请填写" />
    </div>
    <button class="btn" id="loginSubmit" style="width:100%">登录</button>
    <p class="sub" style="text-align:center;margin-top:12px">
      <a href="#" id="loginToggle">没有账号？去注册</a>
    </p>
    <div id="loginWxSection">
      <div class="divider"><span>或</span></div>
      <button class="btn ghost" id="loginWxBtn" style="width:100%">🟢 微信扫码登录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/env.js"></script>
<script src="/js/login-modal.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
