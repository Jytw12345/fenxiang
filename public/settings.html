<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>安全分享 · 设置</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<aside class="side">
  <div class="brand">安全<span>分享</span></div>
  <nav class="nav">
    <a href="/"><span class="ic">＋</span><span class="txt">创建分享</span></a>
    <a class="nav-auth" href="/admin.html"><span class="ic">📁</span><span class="txt">我的分享</span></a>
    <a class="nav-auth" href="/admin.html#files"><span class="ic">🗂</span><span class="txt">文件管理</span></a>
    <a class="nav-super" href="/admin.html"><span class="ic">🛡</span><span class="txt">管理后台</span></a>
    <a class="nav-auth active" href="/settings.html"><span class="ic">⚙</span><span class="txt">设置</span></a>
  </nav>
  <div class="me">
    <div class="av">安</div>
    <div><div class="me-n">安全分享</div><small>内部工作台</small></div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="crumb">工作台 / <b>设置</b></div>
    <div class="top-right"><span id="userArea" class="sub"></span></div>
  </div>

  <div class="wrap set-wrap">
    <div class="set-head">
      <div>
        <h1 class="page-title">账号设置</h1>
        <p class="page-sub">账号、密码与默认分享参数，集中管理</p>
      </div>
    </div>

    <div id="setNeedLogin" class="empty" style="display:none">
      请先 <a href="/" onclick="window.openLoginModal&&window.openLoginModal();return false;">登录</a> 后再查看设置。
    </div>

    <div id="setContent" class="set-cards">
      <!-- 账号信息 -->
      <section class="scard">
        <h3>账号信息</h3>
        <div class="frow"><label>邮箱（不可修改）</label><input id="setEmail" class="inp" readonly /></div>
        <div class="frow"><label>角色</label><input id="setRole" class="inp" readonly /></div>
        <div class="frow"><label>真实姓名</label><input id="setRealName" class="inp" placeholder="请输入真实姓名" /></div>
        <div class="frow" id="setOrgSec" style="display:none"><label>所属组织</label><input id="setOrg" class="inp" readonly /></div>
      </section>

      <!-- 修改密码 -->
      <section class="scard">
        <h3>修改密码 <small>留空则不修改</small></h3>
        <div class="frow"><label>原密码</label><div class="pw"><input id="setOldPw" type="password" class="inp" placeholder="原密码" /><button type="button" class="pw-toggle" id="setOldToggle" title="显示/隐藏">👁️</button></div></div>
        <div class="frow"><label>新密码</label><div class="pw"><input id="setNewPw" type="password" class="inp" placeholder="至少 8 位，含字母和数字" /><button type="button" class="pw-toggle" id="setNewToggle" title="显示/隐藏">👁️</button></div></div>
        <div class="frow"><label>确认新密码</label><input id="setNewPw2" type="password" class="inp" placeholder="再次输入新密码" /></div>
      </section>

      <!-- 默认分享参数 -->
      <section class="scard span2">
        <h3>默认分享参数 <small>新建分享自动带入</small></h3>
        <div class="grid2">
          <div class="frow"><label>默认有效期</label>
            <select id="setExpire" class="inp">
              <option value="1">1 天</option>
              <option value="7">7 天</option>
              <option value="30">30 天</option>
              <option value="0">永久有效</option>
            </select>
          </div>
          <div class="frow"><label>默认验证方式</label>
            <select id="setAuthMode" class="inp">
              <option value="open">公开（任何人可打开）</option>
              <option value="approve">申请授权（需我批准）</option>
              <option value="wechat">微信验证（访客扫码）</option>
            </select>
          </div>
          <div class="frow"><label>默认访问码</label><input id="setCode" class="inp" placeholder="留空不设" /></div>
          <div class="frow"><label>默认水印</label><input id="setWatermark" class="inp" placeholder="如：内部资料 严禁外传" /></div>
          <div class="frow"><label>最大人数</label><input id="setMaxViewers" type="number" min="0" class="inp" placeholder="0 = 不限制" /></div>
          <div class="frow"><label>最大次数</label><input id="setMaxViews" type="number" min="0" class="inp" placeholder="0 = 不限制" /></div>
          <div class="frow"><label>单次时长(分)</label><input id="setDuration" type="number" min="0" class="inp" placeholder="0 = 不限制" /></div>
          <div class="frow"><label>仅预览前(页)</label><input id="setPreviewPages" type="number" min="0" class="inp" placeholder="0 = 不限制" /></div>
        </div>
        <div class="tgls">
          <label class="switch"><input type="checkbox" id="setCopy" checked /> <span>禁止复制</span></label>
          <label class="switch"><input type="checkbox" id="setPrint" checked /> <span>禁止打印</span></label>
          <label class="switch"><input type="checkbox" id="setDownload" checked /> <span>禁止下载</span></label>
          <label class="switch"><input type="checkbox" id="setScreenshot" /> <span>防截图</span></label>
        </div>
      </section>

    </div>

    <div class="set-foot">
      <div id="setMsg" class="form-msg"></div>
      <button class="btn ghost sm" id="setClearCache">清除本地缓存</button>
      <button class="btn danger sm" id="setLogout">退出登录</button>
      <button class="btn sm" id="setSave">保存设置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/env.js"></script>
<script src="/js/login-modal.js"></script>
<script src="/js/settings.js"></script>
</body>
</html>
