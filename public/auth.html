<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>安全分享 · 登录</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="wrap" style="max-width:420px">
  <div class="topbar">
    <div class="brand">安全<span>分享</span></div>
    <a class="sub" href="/">← 返回首页</a>
  </div>

  <div class="card" id="alreadyIn" style="display:none">
    <p class="sub" style="text-align:center">你已登录</p>
    <div style="text-align:center;margin-top:10px">
      <a class="btn" href="/admin.html">进入我的分享</a>
    </div>
  </div>

  <div class="card" id="formCard">
    <h2 id="formTitle">登录</h2>
    <div id="authMsg" class="sub" style="color:#e5484d;min-height:18px;margin-bottom:6px"></div>
    <div class="field">
      <label>邮箱</label>
      <input id="email" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label>密码</label>
      <input id="pw" type="password" placeholder="至少 6 位" />
    </div>
    <div class="field" id="inviteField" style="display:none">
      <label>邀请码（选填，加入公司组织）</label>
      <input id="invite" placeholder="如已有公司邀请码请填写" />
    </div>
    <button class="btn" id="submitBtn" style="width:100%">登录</button>
    <p class="sub" style="text-align:center;margin-top:12px">
      <a href="#" id="toggleMode">没有账号？去注册</a>
    </p>

    <div id="wxSection">
      <div class="divider"><span>或</span></div>

      <button class="btn ghost" id="wxBtn" style="width:100%">🟢 微信扫码登录</button>
      <div id="wxBox" style="display:none;text-align:center;margin-top:14px">
        <img id="wxQr" class="qr" alt="微信扫码" style="margin:0 auto" />
        <p class="sub" id="wxTip">请用微信扫码（演示模式可点下方按钮）</p>
        <button class="btn sm" id="wxSim">模拟扫码确认</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/env.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
