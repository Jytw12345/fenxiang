<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>安全分享 · 创建分享</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<aside class="side">
  <div class="brand">安全<span>分享</span></div>
  <nav class="nav">
    <a class="active" href="/"><span class="ic">＋</span><span class="txt">创建分享</span></a>
    <a href="/admin.html"><span class="ic">📁</span><span class="txt">我的分享</span></a>
    <a href="/admin.html"><span class="ic">🛡</span><span class="txt">管理后台</span></a>
    <a href="#"><span class="ic">⚙</span><span class="txt">设置</span></a>
  </nav>
  <div class="me">
    <div class="av">安</div>
    <div><div class="me-n">安全分享</div><small>内部工作台</small></div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="crumb">工作台 / <b>创建分享</b></div>
    <div class="top-right"><span id="userArea" class="sub"></span></div>
  </div>

  <div class="wrap">
    <h1 class="page-title">创建安全分享</h1>
    <p class="page-sub">上传文件并设置访问权限，生成加密分享链接，访客在微信中即可安全查看、限时阅读。</p>

    <div class="hero">
      <div class="drop" id="drop">
        <div class="icon">⬆</div>
        <div><b>拖拽文件到此处</b>，或点击选择</div>
        <div class="s">支持 PDF / Word / 图片 · 单文件最大 200MB · 自动生成在线预览</div>
      </div>
      <div class="file-pill" id="fileinfo">
        <div class="ic" id="fiIc">📄</div>
        <div>
          <div class="nm" id="fiNm"></div>
          <div class="sz" id="fiSz"></div>
        </div>
        <a href="#" id="fiClear">移除</a>
      </div>
      <input type="file" id="file" hidden />
    </div>

    <div class="sec-title">访问权限设置</div>
    <div class="cfg">
      <div class="field">
        <div class="lab">文件名称</div>
        <input id="name" placeholder="展示给访客，默认使用原文件名" />
      </div>
      <div class="field">
        <div class="lab">有效期 / 访问码</div>
        <div class="row2">
          <select id="expire">
            <option value="1">1 天</option>
            <option value="7" selected>7 天</option>
            <option value="30">30 天</option>
            <option value="0">永久有效</option>
          </select>
          <input id="code" placeholder="访问码（留空不设）" />
        </div>
      </div>
      <div class="field">
        <div class="lab">验证方式</div>
        <select id="authMode">
          <option value="open">公开（任何人都可打开）</option>
          <option value="approve">申请授权（需我批准）</option>
          <option value="wechat">微信验证（访客扫码）</option>
        </select>
      </div>
      <div class="field">
        <div class="lab">访问控制 <small>0 = 不限制</small></div>
        <div class="triple">
          <div><div class="lab">最大人数</div><input id="maxViewers" type="number" min="0" value="0" /></div>
          <div><div class="lab">最大次数</div><input id="maxViews" type="number" min="0" value="0" /></div>
          <div><div class="lab">单次时长(分)</div><input id="duration" type="number" min="0" value="0" /></div>
        </div>
      </div>
      <div class="field wide">
        <div class="lab">防盗用 & 水印</div>
        <div class="chips" style="margin-bottom:11px">
          <label class="switch"><input type="checkbox" id="rCopy" checked /> <span>禁止复制</span></label>
          <label class="switch"><input type="checkbox" id="rPrint" checked /> <span>禁止打印</span></label>
          <label class="switch"><input type="checkbox" id="rDownload" checked /> <span>禁止下载</span></label>
          <label class="switch"><input type="checkbox" id="rScreenshot" /> <span>防截图</span></label>
        </div>
        <input id="watermark" placeholder="水印文字（如：内部资料 严禁外传）" />
      </div>
    </div>

    <div class="foot">
      <button class="btn ghost">存为草稿</button>
      <button class="btn" id="shareBtn">立即分享</button>
    </div>
  </div>
</div>

<div class="modal" id="result">
  <div class="box" style="position:relative">
    <button class="modal-close" id="closeResult" aria-label="关闭">×</button>
    <h2 style="margin-bottom:6px">分享创建成功 🎉</h2>
    <p class="sub">复制链接或扫码即可安全分享</p>
    <img class="qr" id="qrImg" alt="二维码" />
    <div class="linkbox">
      <input id="linkInput" readonly />
      <button class="btn sm" id="copyLink">复制</button>
    </div>
    <div style="display:flex;gap:10px;justify-content:center">
      <a class="btn ghost sm" id="openViewer" target="_blank">预览</a>
      <a class="btn sm" id="openAdmin" target="_blank">进入管理后台</a>
    </div>
  </div>
</div>

<div class="modal" id="loginModal">
  <div class="box" style="max-width:420px">
    <h2 id="loginTitle">登录</h2>
    <div id="loginMsg" class="sub" style="color:#e5484d;min-height:18px;margin-bottom:6px"></div>
    <div class="field">
      <label>邮箱</label>
      <input id="loginEmail" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label>密码</label>
      <input id="loginPw" type="password" placeholder="至少 8 位" />
    </div>
    <div class="field" id="loginRealNameField" style="display:none">
      <label>真实姓名（必填）</label>
      <input id="loginRealName" placeholder="请输入真实姓名" />
    </div>
    <div class="field" id="loginInviteField" style="display:none">
      <label>邀请码（选填，加入公司组织）</label>
      <input id="loginInvite" placeholder="如已有公司邀请码请填写" />
    </div>
    <button class="btn" id="loginSubmit" style="width:100%">登录</button>
    <p class="sub" style="text-align:center;margin-top:12px">
      <a href="#" id="loginToggle">没有账号？去注册</a>
    </p>
    <div id="loginWxSection">
      <div class="divider"><span>或</span></div>
      <button class="btn ghost" id="loginWxBtn" style="width:100%">🟢 微信扫码登录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/env.js"></script>
<script src="/js/login-modal.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
