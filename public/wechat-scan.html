<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>安阅 · 微信扫码确认</title>
<link rel="stylesheet" href="/style.css" />
<style>
  .scan-wrap{max-width:380px;margin:0 auto;padding:36px 20px;text-align:center}
  .scan-icon{font-size:46px;margin:6px 0 2px}
  .scan-tip{color:#666;font-size:14px;line-height:1.8;margin:14px 0 22px}
  .scan-ok{display:none;color:#16a34a;font-weight:600;font-size:16px;margin-top:18px}
  .scan-err{display:none;color:#e5484d;font-size:14px;margin-top:18px}
  .state-hint{font-size:12px;color:#a0a0a0;word-break:break-all;margin-top:16px}
</style>
</head>
<body>
<div class="wrap scan-wrap">
  <div class="brand">安<span>阅</span></div>
  <div class="scan-icon">📷</div>
  <h2 id="title">微信扫码确认</h2>
  <p class="scan-tip" id="tip">请在微信中点击「确认」，完成登录或访问授权。<br/>确认成功后返回原页面即可继续。</p>
  <button class="btn" id="confirmBtn" style="width:100%">✅ 确认</button>
  <div class="scan-ok" id="ok">验证成功，请返回原页面继续。</div>
  <div class="scan-err" id="err"></div>
  <div class="state-hint" id="stateHint"></div>
</div>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const state = params.get('state');
  if (!state) {
    $('#tip').textContent = '无效的扫码链接（缺少 state 参数），请返回原页面重新发起。';
    $('#confirmBtn').style.display = 'none';
    return;
  }
  $('#stateHint').textContent = 'state: ' + state;

  $('#confirmBtn').addEventListener('click', async () => {
    $('#confirmBtn').disabled = true;
    try {
      const r = await fetch('/api/wechat/sim', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state })
      });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.ok) {
        $('#confirmBtn').style.display = 'none';
        $('#ok').style.display = 'block';
        // 给予用户看到成功提示的时间，再尝试关闭当前标签页
        setTimeout(() => { try { window.close(); } catch (e) {} }, 1500);
      } else {
        const msg = (d && d.error) ? ('确认失败：' + d.error) : '确认失败，请重试';
        $('#err').style.display = 'block';
        $('#err').textContent = msg;
        $('#confirmBtn').disabled = false;
      }
    } catch (e) {
      $('#err').style.display = 'block';
      $('#err').textContent = '网络错误，请重试';
      $('#confirmBtn').disabled = false;
    }
  });
})();
</script>
</body>
</html>
